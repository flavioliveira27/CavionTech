version: "3.8"

# =============================================================
# Docker Compose – PRODUÇÃO CAVION TECH
# Requisito: preencher .env antes do deploy
# =============================================================

services:
  nginx:
    container_name: caviontech-nginx
    image: nginx:alpine
    ports:
      - "8003:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wp_uploads_prod:/var/www/html/wp-content/uploads:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - wordpress
    networks:
      - caviontech_prod
      - nginx-proxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  wordpress:
    container_name: caviontech-wordpress
    image: wordpress:latest
    expose:
      - "80"
    volumes:
      - ./caviontech-theme:/var/www/html/wp-content/themes/caviontech-theme:ro
      - wp_plugins:/var/www/html/wp-content/plugins
      - wp_uploads_prod:/var/www/html/wp-content/uploads
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - caviontech_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-login.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    container_name: caviontech-db-prod
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - .env
    networks:
      - caviontech_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  caviontech_prod:
    driver: bridge
  nginx-proxy-network:
    external: true

volumes:
  db_data:
  wp_plugins:
  wp_uploads_prod:
  certbot_certs:
  certbot_www:
